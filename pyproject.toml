[project]
name = "cipherlab"
version = "0.1.0"
description = "Автоматическое распознавание и криптоанализ классических шифров"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.3.3",
    "streamlit>=1.60.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cipherlab"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
