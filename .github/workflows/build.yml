name: Build and Test

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ============================================================
  # LINUX: Сборка C++ и Python .exe
  # ============================================================
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ make
    
    - name: Compile C++ affine
      run: |
        g++ -std=c++17 -O2 -o src/cipherlab/ciphers/affine src/cipherlab/ciphers/affine.cpp
        chmod +x src/cipherlab/ciphers/affine
    
    - name: Test C++ binary
      run: |
        echo "Привет мир" | ./src/cipherlab/ciphers/affine encrypt 5 8 ru
        echo "Хъусад жуъ" | ./src/cipherlab/ciphers/affine decrypt 5 8 ru
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Python deps
      run: |
        pip install -e .
        pip install pyinstaller streamlit pandas numpy
    
    - name: Build standalone executable with PyInstaller
      run: |
        pyinstaller --onefile --name cipherlab --add-data "src/cipherlab/ciphers/affine:src/cipherlab/ciphers" --collect-all streamlit --collect-all pandas --collect-all numpy app/streamlit_app.py
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cipherlab-linux
        path: |
          src/cipherlab/ciphers/affine
          dist/cipherlab

  # ============================================================
  # WINDOWS: Сборка C++ и Python .exe
  # ============================================================
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
    
    - name: Compile C++ affine
      shell: cmd
      run: |
        cl /EHsc /std:c++17 /O2 /Fe:src\cipherlab\ciphers\affine.exe src\cipherlab\ciphers\affine.cpp
    
    - name: Test C++ binary
      shell: cmd
      run: |
        echo Привет мир | src\cipherlab\ciphers\affine.exe encrypt 5 8 ru
        echo Хъусад жуъ | src\cipherlab\ciphers\affine.exe decrypt 5 8 ru
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Python deps
      run: |
        pip install -e .
        pip install pyinstaller streamlit pandas numpy
    
    - name: Build standalone executable with PyInstaller
      shell: cmd
      run: |
        pyinstaller --onefile --name cipherlab --add-data "src\cipherlab\ciphers\affine.exe;src\cipherlab\ciphers" --collect-all streamlit --collect-all pandas --collect-all numpy app\streamlit_app.py
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cipherlab-windows
        path: |
          src\cipherlab\ciphers\affine.exe
          dist\cipherlab.exe

  # ============================================================
  # ТЕСТЫ (опционально, можно запускать отдельно)
  # ============================================================
  test-python-linux:
    name: Test Python (Linux)
    runs-on: ubuntu-latest
    needs: build-linux
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: cipherlab-linux
        path: ./artifacts
    
    - name: Install dependencies
      run: |
        pip install -e .
        pip install pytest streamlit pandas numpy
    
    - name: Run tests
      run: |
        # Копируем бинарник в нужное место
        cp ./artifacts/affine src/cipherlab/ciphers/affine
        chmod +x src/cipherlab/ciphers/affine
        python -m pytest tests/ -v

  # ============================================================
  # РЕЛИЗ (создаёт Release, если тег)
  # ============================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/cipherlab-linux/affine
          artifacts/cipherlab-linux/cipherlab
          artifacts/cipherlab-windows/affine.exe
          artifacts/cipherlab-windows/cipherlab.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
