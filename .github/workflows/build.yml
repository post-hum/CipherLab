name: Build and Test

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build C++ (Linux)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ make
    
    - name: Compile affine cipher
      run: |
        g++ -std=c++17 -O2 -o src/cipherlab/ciphers/affine src/cipherlab/ciphers/affine.cpp
        chmod +x src/cipherlab/ciphers/affine
    
    - name: Test C++ binary
      run: |
        echo "Привет мир" | ./src/cipherlab/ciphers/affine encrypt 5 8 ru
        echo "Хъусад жуъ" | ./src/cipherlab/ciphers/affine decrypt 5 8 ru
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: affine-linux
        path: src/cipherlab/ciphers/affine

  build-windows:
    name: Build C++ (Windows)
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install MSVC
      uses: ilammy/msvc-dev-cmd@v1
    
    - name: Compile affine cipher
      run: |
        cl /EHsc /std:c++17 /O2 /Fe:src/cipherlab/ciphers/affine.exe src/cipherlab/ciphers/affine.cpp
    
    - name: Test C++ binary
      shell: cmd
      run: |
        echo Привет мир | src\cipherlab\ciphers\affine.exe encrypt 5 8 ru
        echo Хъусад жуъ | src\cipherlab\ciphers\affine.exe decrypt 5 8 ru
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: affine-windows
        path: src/cipherlab/ciphers/affine.exe

  test-python-linux:
    name: Python Tests (Linux)
    runs-on: ubuntu-latest
    needs: build-linux
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Download C++ binary
      uses: actions/download-artifact@v4
      with:
        name: affine-linux
        path: src/cipherlab/ciphers/
    
    - name: Make binary executable
      run: |
        chmod +x src/cipherlab/ciphers/affine
    
    - name: Install dependencies
      run: |
        pip install -e .
        pip install pytest streamlit pandas numpy
    
    - name: Run tests
      run: |
        python -m pytest tests/ -v

  test-python-windows:
    name: Python Tests (Windows)
    runs-on: windows-latest
    needs: build-windows
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Download C++ binary
      uses: actions/download-artifact@v4
      with:
        name: affine-windows
        path: src/cipherlab/ciphers/
    
    - name: Install dependencies
      run: |
        pip install -e .
        pip install pytest streamlit pandas numpy
    
    - name: Run tests
      run: |
        python -m pytest tests/ -v

  build-package:
    name: Build Python Package
    runs-on: ubuntu-latest
    needs: [test-python-linux, test-python-windows]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install build tools
      run: |
        pip install build wheel
    
    - name: Build package
      run: |
        python -m build
    
    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: python-package
        path: dist/

  build-exe-linux:
    name: Build Executable (Linux)
    runs-on: ubuntu-latest
    needs: [test-python-linux, test-python-windows]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Download C++ binary
      uses: actions/download-artifact@v4
      with:
        name: affine-linux
        path: src/cipherlab/ciphers/
    
    - name: Make binary executable
      run: |
        chmod +x src/cipherlab/ciphers/affine
    
    - name: Install dependencies
      run: |
        pip install -e .
        pip install pyinstaller streamlit pandas numpy
    
    - name: Build executable
      run: |
        pyinstaller --onefile --name cipherlab --add-data "src/cipherlab/ciphers/affine:src/cipherlab/ciphers" app/streamlit_app.py
    
    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: cipherlab-linux
        path: dist/cipherlab

  build-exe-windows:
    name: Build Executable (Windows)
    runs-on: windows-latest
    needs: [test-python-linux, test-python-windows]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Download C++ binary
      uses: actions/download-artifact@v4
      with:
        name: affine-windows
        path: src/cipherlab/ciphers/
    
    - name: Install dependencies
      run: |
        pip install -e .
        pip install pyinstaller streamlit pandas numpy
    
    - name: Build executable
      run: |
        pyinstaller --onefile --name cipherlab --add-data "src/cipherlab/ciphers/affine.exe;src/cipherlab/ciphers" app/streamlit_app.py
    
    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: cipherlab-windows
        path: dist/cipherlab.exe

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-exe-linux, build-exe-windows, build-package]
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/affine-linux/affine
          artifacts/affine-windows/affine.exe
          artifacts/cipherlab-linux/cipherlab
          artifacts/cipherlab-windows/cipherlab.exe
          artifacts/python-package/*.whl
          artifacts/python-package/*.tar.gz
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
