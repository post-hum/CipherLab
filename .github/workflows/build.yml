name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make
      - name: Compile C++
        run: |
          g++ -std=c++17 -O2 -o src/cipherlab/ciphers/affine src/cipherlab/ciphers/affine.cpp
          chmod +x src/cipherlab/ciphers/affine
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: |
          pip install -e .
          pip install pyinstaller streamlit pandas numpy
      - name: Build executable with main.py wrapper
        run: |
          pyinstaller --onefile --name cipherlab \
            --add-data "data:data" \
            --add-data "app:app" \
            --add-data "src/cipherlab/ciphers/affine:src/cipherlab/ciphers" \
            --collect-all streamlit \
            --collect-all pandas \
            --collect-all numpy \
            main.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: cipherlab-linux
          path: |
            src/cipherlab/ciphers/affine
            dist/cipherlab

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile C++
        shell: cmd
        run: |
          cl /EHsc /std:c++17 /O2 /Fe:src\cipherlab\ciphers\affine.exe src\cipherlab\ciphers\affine.cpp
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: |
          pip install -e .
          pip install pyinstaller streamlit pandas numpy
      - name: Build executable with main.py wrapper
        shell: cmd
        run: |
          pyinstaller --onefile --name cipherlab --add-data "data;data" --add-data "app;app" --add-data "src\cipherlab\ciphers\affine.exe;src\cipherlab\ciphers" --collect-all streamlit --collect-all pandas --collect-all numpy main.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: cipherlab-windows
          path: |
            src\cipherlab\ciphers\affine.exe
            dist\cipherlab.exe

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: List downloaded artifacts
        run: find artifacts -type f
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/cipherlab-linux/affine
            artifacts/cipherlab-linux/cipherlab
            artifacts/cipherlab-windows/affine.exe
            artifacts/cipherlab-windows/cipherlab.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
